name: 새 글 알림

on:
  schedule:
    # 평일 10:00 KST (01:00 UTC). 주말 글은 월요일에 금요일 이후 글로 한꺼번에 잡힌다.
    # 실행기 Mac이 꺼져 있으면 대기하다가 켜지면 돈다 (24시간 넘게 꺼져 있으면 그날 실행은 취소된다).
    - cron: "0 1 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write # state/seen.json 커밋
  issues: write # 알림 이슈 생성

concurrency:
  group: daily-new-posts
  cancel-in-progress: false

jobs:
  check:
    # 우아한형제들·Mercari가 GitHub 데이터센터 IP를 막아서 사용자 Mac(self-hosted runner)에서 돈다
    runs-on: [self-hosted, tech-blogs-mac]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 파이썬 환경 준비
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r scripts/requirements.txt

      - name: 새 글 확인
        id: check
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/check_new_posts.py --body issue.md | tee result.txt
          grep '^new_count=' result.txt >> "$GITHUB_OUTPUT"

      - name: 알림 이슈 만들기
        if: steps.check.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.check.outputs.new_count }}
        run: |
          gh label create new-posts --color 0E8A16 --description "새 기술 블로그 글 알림" 2>/dev/null || true
          gh issue create \
            --title "새 AI 글 $(TZ=Asia/Seoul date +%Y-%m-%d) · ${NEW_COUNT}개" \
            --body-file issue.md \
            --label new-posts \
            --assignee "${{ github.repository_owner }}"

      - name: 확인 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "새 글 확인 기록 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
